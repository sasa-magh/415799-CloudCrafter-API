apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: events
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sasa-magh/415799-CloudCrafter-API.git
    targetRevision: main
    path: charts/events
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

